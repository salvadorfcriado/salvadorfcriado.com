name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, build, verify dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs puppeteer's postinstall, which downloads its own Chrome
      # into ~/.cache/puppeteer. The ubuntu-latest image already ships the
      # shared libraries headless Chrome needs, so no apt packages are required.
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npx astro check

      # `prebuild` renders the per-post OG cards with Puppeteer.
      - name: Build
        run: npm run build

      - name: Verify dist
        run: node scripts/check-dist.mjs
